<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永赢先锋半导体智选混合基金2025年第4季度报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 15px;
        }
        
        .summary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .summary h2 {
            color: #00d4ff;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        
        .summary-content {
            line-height: 1.8;
            white-space: pre-wrap;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .kpi-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .kpi-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
        }
        
        .kpi-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }
        
        .kpi-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            word-break: break-word;
            line-height: 1.2;
        }

        .kpi-unit {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .chart-card:hover {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .chart-title {
            font-size: 1.2em;
            color: #00d4ff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .chart-container {
            width: 100%;
            height: 400px;
        }
        
        .chart-note {
            margin-top: 10px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }
        
        .export-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <button class="export-btn" onclick="exportReport()">📥 导出报告</button>
    
    <div class="container">
        <div class="header">
            <h1>永赢先锋半导体智选混合基金2025年第4季度报告</h1>
        </div>
        
        <div class="summary">
            <h2>📊 分析摘要</h2>
            <div class="summary-content">• 报告期末基金份额总额为7,003,223,580.71份
• 永赢先锋半导体智选混合发起A类基金在报告期内实现了-5,822,012.66元的已实现收益
• 永赢先锋半导体智选混合发起C类基金在报告期内实现了-128,842,616.78元的已实现收益
• 过去三个月，A类基金的净值增长率为11.55%，而业绩比较基准收益率为-5.21%
• 自基金合同生效起，A类基金的净值增长率为33.37%，而业绩比较基准收益率为6.44%</div>
        </div>
        
        <div class="kpi-section" id="kpi-section">
            <!-- KPI 指标将由 JS 动态生成 -->
        </div>
        
        <div class="charts-grid" id="charts-grid">
            <!-- 图表将由 JS 动态生成 -->
        </div>
    </div>
    
    <script>
        const reportData = {
  "title": "永赢先锋半导体智选混合基金2025年第4季度报告",
  "summary": "• 报告期末基金份额总额为7,003,223,580.71份\n• 永赢先锋半导体智选混合发起A类基金在报告期内实现了-5,822,012.66元的已实现收益\n• 永赢先锋半导体智选混合发起C类基金在报告期内实现了-128,842,616.78元的已实现收益\n• 过去三个月，A类基金的净值增长率为11.55%，而业绩比较基准收益率为-5.21%\n• 自基金合同生效起，A类基金的净值增长率为33.37%，而业绩比较基准收益率为6.44%",
  "kpis": [
    {
      "label": "报告期末基金份额总额",
      "value": 7003223580.71,
      "unit": "份",
      "format": "number"
    },
    {
      "label": "A类基金本期已实现收益",
      "value": -5822012.66,
      "unit": "元",
      "format": "currency"
    },
    {
      "label": "C类基金本期已实现收益",
      "value": -128842616.78,
      "unit": "元",
      "format": "currency"
    },
    {
      "label": "A类基金过去三个月净值增长率",
      "value": 0.1155,
      "unit": "%",
      "format": "percent"
    },
    {
      "label": "A类基金自基金合同生效起净值增长率",
      "value": 0.3337,
      "unit": "%",
      "format": "percent"
    }
  ],
  "charts": [
    {
      "chart_id": "chart_1",
      "title": "A类与C类基金份额总额对比",
      "chart_type": "bar",
      "categories": [
        "A类",
        "C类"
      ],
      "series": [
        {
          "name": "份额总额",
          "data": [
            517348885.94,
            6485874694.77
          ]
        }
      ],
      "unit": "份",
      "note": ""
    },
    {
      "chart_id": "chart_2",
      "title": "A类与C类基金本期已实现收益对比",
      "chart_type": "bar",
      "categories": [
        "A类",
        "C类"
      ],
      "series": [
        {
          "name": "已实现收益",
          "data": [
            -5822012.66,
            -128842616.78
          ]
        }
      ],
      "unit": "元",
      "note": ""
    },
    {
      "chart_id": "chart_3",
      "title": "A类基金净值增长率与业绩比较基准收益率对比",
      "chart_type": "line",
      "categories": [
        "过去三个月",
        "自基金合同生效起"
      ],
      "series": [
        {
          "name": "基金净值增长率",
          "data": [
            0.1155,
            0.3337
          ]
        },
        {
          "name": "业绩比较基准收益率",
          "data": [
            -0.0521,
            0.0644
          ]
        }
      ],
      "unit": "%",
      "note": ""
    }
  ]
};
        const chartInstances = [];
        
        // 渲染 KPI 指标
        function renderKPIs() {
            const kpiSection = document.getElementById('kpi-section');
            if (!reportData.kpis || reportData.kpis.length === 0) {
                kpiSection.style.display = 'none';
                return;
            }
            
            reportData.kpis.forEach(kpi => {
                const card = document.createElement('div');
                card.className = 'kpi-card';
                
                let displayValue = kpi.value;
                if (kpi.format === 'percent') {
                    displayValue = (kpi.value * 100).toFixed(2);
                    // 确保百分比单位存在
                    if (!kpi.unit) {
                        kpi.unit = '%';
                    }
                } else if (kpi.format === 'currency') {
                    displayValue = kpi.value.toLocaleString('zh-CN');
                } else {
                    displayValue = kpi.value.toLocaleString('zh-CN');
                }
                
                card.innerHTML = `
                    <div class="kpi-label">${kpi.label}</div>
                    <div class="kpi-value">${displayValue}</div>
                    <div class="kpi-unit">${kpi.unit}</div>
                `;
                
                kpiSection.appendChild(card);
            });
        }
        
        // 渲染图表
        function renderCharts() {
            const chartsGrid = document.getElementById('charts-grid');
            
            reportData.charts.forEach((chartConfig, index) => {
                // 创建图表容器
                const card = document.createElement('div');
                card.className = 'chart-card';
                
                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';
                chartContainer.id = chartConfig.chart_id || `chart_${index}`;
                
                card.innerHTML = `
                    <div class="chart-title">${chartConfig.title}</div>
                `;
                card.appendChild(chartContainer);
                
                if (chartConfig.note) {
                    const note = document.createElement('div');
                    note.className = 'chart-note';
                    note.textContent = chartConfig.note;
                    card.appendChild(note);
                }
                
                chartsGrid.appendChild(card);
                
                // 初始化 ECharts
                const chart = echarts.init(chartContainer);
                chartInstances.push(chart);
                
                // 构建 ECharts 配置
                const option = buildChartOption(chartConfig);
                chart.setOption(option);
            });
        }
        
        // 构建 ECharts 配置
        function buildChartOption(config) {
            const baseOption = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: config.chart_type === 'pie' ? 'item' : 'axis',
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#00d4ff',
                    borderWidth: 1,
                    textStyle: { color: '#fff' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                animation: true,
                animationDuration: 1000,
                animationEasing: 'cubicOut'
            };
            
            if (config.chart_type === 'pie') {
                return {
                    ...baseOption,
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['50%', '50%'],
                        data: config.series[0].data.map((value, idx) => ({
                            name: config.categories[idx],
                            value: value
                        })),
                        itemStyle: {
                            borderRadius: 8,
                            borderColor: '#0f0c29',
                            borderWidth: 2
                        },
                        label: {
                            color: '#fff',
                            fontSize: 12
                        },
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 212, 255, 0.5)'
                            }
                        }
                    }]
                };
            } else if (config.chart_type === 'line' || config.chart_type === 'area') {
                return {
                    ...baseOption,
                    xAxis: {
                        type: 'category',
                        data: config.categories,
                        axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                        axisLabel: { color: '#fff' }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                        axisLabel: { color: '#fff' },
                        splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } }
                    },
                    series: config.series.map(s => ({
                        name: s.name,
                        type: config.chart_type === 'area' ? 'line' : 'line',
                        data: s.data,
                        smooth: true,
                        areaStyle: config.chart_type === 'area' ? { opacity: 0.3 } : undefined,
                        lineStyle: { width: 3 },
                        itemStyle: {
                            borderWidth: 2,
                            borderColor: '#fff'
                        },
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowColor: 'rgba(0, 212, 255, 0.5)'
                            }
                        }
                    })),
                    legend: {
                        textStyle: { color: '#fff' },
                        top: '5%'
                    }
                };
            } else if (config.chart_type === 'bar') {
                return {
                    ...baseOption,
                    xAxis: {
                        type: 'category',
                        data: config.categories,
                        axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                        axisLabel: { color: '#fff', rotate: config.categories.length > 8 ? 45 : 0 }
                    },
                    yAxis: {
                        type: 'value',
                        axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.3)' } },
                        axisLabel: { color: '#fff' },
                        splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } }
                    },
                    series: config.series.map(s => ({
                        name: s.name,
                        type: 'bar',
                        barMaxWidth: 60,
                        data: s.data,
                        itemStyle: {
                            borderRadius: [8, 8, 0, 0],
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#00d4ff' },
                                { offset: 1, color: '#667eea' }
                            ])
                        },
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowColor: 'rgba(0, 212, 255, 0.5)'
                            }
                        }
                    })),
                    legend: {
                        textStyle: { color: '#fff' },
                        top: '5%'
                    }
                };
            }
            
            return baseOption;
        }
        
        // 响应式调整
        window.addEventListener('resize', debounce(() => {
            chartInstances.forEach(chart => chart.resize());
        }, 200));
        
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
        
        // 导出报告
        function exportReport() {
            const filename = '永赢先锋半导体智选混合基金2025年第4季度报告_' + new Date().toISOString().slice(0, 10) + '.html';
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 初始化页面
        renderKPIs();
        renderCharts();
    </script>
</body>
</html>
