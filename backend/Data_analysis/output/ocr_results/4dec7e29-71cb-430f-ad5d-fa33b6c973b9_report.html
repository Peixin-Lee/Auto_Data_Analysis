<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>永赢先锋半导体智选混合型发起式证券投资基金报告</title><style>body, html { margin: 0; padding: 0; width: 100vw; height: 100svh; overflow: hidden; background: linear-gradient(135deg, #1a1a1a, #2c2c2c) no-repeat center center fixed; background-size: cover; font-family: Arial, sans-serif; color: #fff; } .container { display: flex; justify-content: space-between; padding: 20px; } .col { flex: 1; display: flex; flex-direction: column; gap: 20px; } .panel { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1); padding: 20px; transition: all 0.3s ease; } .panel:hover { box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.2); } .panel-title { font-size: 1.2em; margin-bottom: 10px; } .chart { width: 100%; height: 300px; } .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1); } .logo { font-size: 1.5em; font-weight: bold; } .export-btn { background: #00bfff; color: #fff; border: none; padding: 10px 20px; border-radius: 16px; cursor: pointer; } .export-btn:hover { background: #00e5ff; }</style><script src='https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js'></script><script>let resizeTimeout; window.addEventListener('resize', () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { const newWidth = document.documentElement.clientWidth; const newHeight = document.documentElement.clientHeight; if (newWidth !== window.innerWidth || newHeight !== window.innerHeight) { window.innerWidth = newWidth; window.innerHeight = newHeight; const charts = document.querySelectorAll('.chart'); charts.forEach(chart => { const chartInstance = echarts.getInstanceByDom(chart); if (chartInstance) { chartInstance.resize(); } }); } }, 120); });</script></head><body><div class='header'><div class='logo'>LOGO</div><div class='title'>永赢先锋半导体智选混合型发起式证券投资基金报告</div><button class='export-btn' onclick='exportCharts()'>导出 PNG</button></div><div class='container'><div id='colL' class='col'></div><div id='colC' class='col'></div><div id='colR' class='col'></div></div><script>const data_json = {"kpi": [{"label":"基金规模","value":7003223580.71,"unit":"份"},{"label":"年化收益","value":0.3337,"asPercent":true}],"pies": {"asset_allocation": [],"industry": [],"custom": []},"series": {"annualGrowth": {"categories":["过去三个月","自基金合同生效起"],"data":[11.55,33.37],"name":"净值增长率","unit":"%"},"profit": {"categories":["A类","C类"],"data":[-396469.76,-87981040.44],"name":"本期利润","unit":"元"},"fundVsBenchmark": {"categories":["过去三个月","自基金合同生效起"],"series":[{"name":"基金","unit":"%","data":[11.55,33.37]},{"name":"业绩基准","unit":"%","data":[-5.21,6.44]}]},"monthlyData": {},"topHoldings": {},"feeBreakdown": {},"anyCategory": {}}};function renderKPIs(kpis, container) { kpis.forEach((kpi, index) => { const value = kpi.asPercent ? (kpi.value * 100).toFixed(2) + '%' : kpi.value.toLocaleString() + kpi.unit; const kpiElement = document.createElement('div'); kpiElement.className = 'kpi'; kpiElement.innerHTML = `<span class='kpi-label'>${kpi.label}:</span> <span class='kpi-value'>${value}</span>`; container.appendChild(kpiElement); });}function renderChart(container, options) { const chart = document.createElement('div'); chart.className = 'chart'; container.appendChild(chart); const chartInstance = echarts.init(chart); chartInstance.setOption(options); return chartInstance;}function renderPies(pies, container) { for (const [key, data] of Object.entries(pies)) { if (data.length > 0) { const options = { title: { text: key, left: 'center' }, tooltip: { trigger: 'item' }, series: [{ name: key, type: 'pie', radius: ['40%', '70%'], avoidLabelOverlap: false, label: { show: false, position: 'center' }, emphasis: { label: { show: true, fontSize: '30', fontWeight: 'bold' } }, labelLine: { show: false }, data: data }] }; renderChart(container, options); } }}function renderSeries(series, container) { for (const [key, data] of Object.entries(series)) { if (data.categories && data.data) { let options; if (key === 'fundVsBenchmark') { options = { title: { text: data.name, left: 'center' }, tooltip: { trigger: 'axis' }, legend: { data: data.series.map(s => s.name) }, xAxis: { type: 'category', data: data.categories }, yAxis: { type: 'value' }, series: data.series.map(s => ({ ...s, type: 'line', smooth: true, symbol: 'circle', itemStyle: { normal: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: '#00bfff' }, { offset: 1, color: '#00e5ff' }]) } })) } }; } else { options = { title: { text: data.name, left: 'center' }, tooltip: { trigger: 'axis' }, xAxis: { type: 'category', data: data.categories }, yAxis: { type: 'value' }, series: [{ name: data.name, type: 'bar', data: data.data, itemStyle: { normal: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: '#00bfff' }, { offset: 1, color: '#00e5ff' }]) } } }] }; } renderChart(container, options); } }}const colL = document.getElementById('colL'); const colC = document.getElementById('colC'); const colR = document.getElementById('colR');renderKPIs(data_json.kpi, colC);renderPies(data_json.pies, colL);renderSeries(data_json.series, colC);function exportCharts() { const charts = document.querySelectorAll('.chart'); charts.forEach((chart, index) => { const chartInstance = echarts.getInstanceByDom(chart); if (chartInstance) { chartInstance.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#1a1a1a' }).then(url => { const a = document.createElement('a'); a.href = url; a.download = `chart_${index + 1}.png`; a.click(); }); } });}</script></body></html>
